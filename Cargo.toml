[package]
name = "segstore"
version = "0.6.1"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
authors = ["Arc <attobop@gmail.com>"]
description = "Generic durable segmented store: write-ahead log, immutable segments, tombstones, checkpoint, and compaction"
repository = "https://github.com/arclabs561/segstore"
documentation = "https://docs.rs/segstore"
keywords = ["lsm", "wal", "segments", "index", "persistence"]
categories = ["data-structures", "database-implementations"]
include = ["/src", "/examples", "/benches", "/README.md", "/CHANGELOG.md", "/LICENSE*"]

[workspace]

[dependencies]
crc32fast = "1"
durability = "0.8"
fs4 = "1.1"
serde = { version = "1", features = ["derive"] }

[features]
# Shared behaviour tests for indexes built on SegmentedStore; enable it from a
# store crate's dev-dependencies and call `conformance::run_all`.
conformance = []

[dev-dependencies]
proptest = "1"
criterion = "0.5"
postings = { version = "0.4.2", features = ["raw-segment"] }

[[bench]]
name = "store"
harness = false

[[example]]
name = "postings_sidecar"
